<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reportes de Veterinaria Sonrisas">
    <title>Reportes · Veterinaria Sonrisas</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="report-page">
    <!-- Sin barra lateral: aquí solo tenía dos enlaces y le quitaba a la tabla el ancho que
         necesita. Las migas de pan llevan de vuelta al panel. -->
    <div class="dashboard-layout">
        <main class="main-content">
            <header class="topbar">
                <div class="report-home">
                    <img class="report-home-logo" src="../pictures/logo.png" alt="Veterinaria Sonrisas">
                    <nav aria-label="Ruta de navegación">
                        <ol class="report-breadcrumb">
                            <li><a href="dashboard.html">Panel principal</a></li>
                            <li aria-current="page"><h1>Reportes</h1></li>
                        </ol>
                    </nav>
                </div>
                <div class="topbar-right">
                    <div class="connection-box">
                        <label for="apiBase">API</label>
                        <input id="apiBase" type="url" readonly>
                        <span id="connectionStatus" class="status-dot" title="Estado de conexión" role="img" aria-label="Estado de conexión"></span>
                    </div>
                    <div class="user-box">
                        <div class="user-copy"><strong id="userName">—</strong><span id="userRole"></span></div>
                        <button id="logoutButton" class="button button-secondary button-small" type="button">Cerrar sesión</button>
                    </div>
                </div>
            </header>

            <section class="content-area">
                <div class="report-layout">
                    <aside id="reportMenu" class="content-card report-menu" aria-label="Lista de reportes"></aside>

                    <article class="content-card report-main" aria-labelledby="reportTitle">
                        <header>
                            <div class="report-heading">
                                <h2 id="reportTitle">Elige un reporte</h2>
                                <p id="reportGroup" class="report-group"></p>
                            </div>
                            <p id="reportDescription" class="report-description">Elige un reporte de la lista, ajusta los filtros y pulsa Generar.</p>
                        </header>

                        <form id="reportForm" class="report-toolbar hidden" novalidate>
                            <div id="reportFilters" class="report-filters"></div>
                            <div class="report-actions">
                                <button class="button report-run" type="submit">Generar</button>
                                <div class="report-export" role="group" aria-label="Exportar el reporte">
                                    <span class="report-export-label" aria-hidden="true">Exportar</span>
                                    <button id="exportExcel" class="button button-secondary" type="button" disabled>Excel</button>
                                    <button id="exportPdf" class="button button-secondary" type="button" disabled>PDF</button>
                                </div>
                            </div>
                        </form>

                        <div id="reportSummary" class="report-summary" aria-live="polite"></div>
                        <div id="reportTable"></div>
                    </article>
                </div>
            </section>
        </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- Librerías incluidas en el proyecto (funcionan sin internet) -->
    <script src="../vendor/exceljs.min.js"></script>
    <script src="../vendor/jspdf.umd.min.js"></script>
    <script src="../vendor/jspdf.plugin.autotable.min.js"></script>
    <!-- Marca de los documentos descargados (logo, colores, membrete y pie) -->
    <script src="../js/marca-logo.js"></script>
    <script src="../js/marca.js"></script>
    <script src="../js/reportes.js"></script>
</body>
</html>
